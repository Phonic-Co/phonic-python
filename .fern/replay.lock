      +        self._recv_results = recv_results
      +        self._send_error = send_error
      +        self.sent: typing.List[typing.Any] = []
      +
      +    async def recv(self) -> typing.Any:
      +        result = self._recv_results.pop(0)
      +        if isinstance(result, BaseException):
      +            raise result
