name: Publish to PyPI

# Publishes the package to PyPI when a PR is merged into main (i.e. when the SDK PR that
# fern-config opened gets reviewed and merged). The version is whatever is in pyproject.toml,
# which fern-config bakes in when it opens the PR.
#
# Authenticates with PyPI trusted publishing (OIDC): PyPI accepts uploads only from this
# workflow running in the main-only `pypi` environment, so no long-lived PyPI token exists.
#
# Kept in .fernignore so Fern's regeneration doesn't remove it.
#
# Requires the PyPI project's trusted publisher: Phonic-Co/phonic-python, publish.yml, environment `pypi`.

on:
  push:
    branches: [main]

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: write # gh release create
      id-token: write # PyPI trusted publishing
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Nothing here pushes, so don't leave the token in git config.
          persist-credentials: false

      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install poetry
        run: python -m pip install poetry==1.5.1

      - name: Read package version
        id: v
        run: echo "version=$(poetry version -s)" >> "$GITHUB_OUTPUT"

      # Don't fail on unrelated merges to main — only publish a version that isn't live yet.
      - name: Check if already published
        id: check
        run: |
          if curl -fsSL "https://pypi.org/pypi/phonic/${{ steps.v.outputs.version }}/json" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "phonic ${{ steps.v.outputs.version }} already on PyPI — skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: poetry build

      - name: Publish to PyPI
        if: steps.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

      - name: Create GitHub release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: gh release view "v${VERSION}" >/dev/null 2>&1 || gh release create "v${VERSION}" --title "v${VERSION}" --target "${GITHUB_SHA}" --generate-notes
